
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIPGO — Sayohat olami</title>
<style>
:root {
  --bg:#101311;
  --panel:#191e1a;
  --green:#064e3b;
  --green2:#0b7255;
  --mint:#a8e4cb;
  --text:#f3f7f3;
  --muted:#a1aaa3;
  --orange:#f5a623;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;padding-bottom:85px;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
header{
  height:70px;padding:0 5%;display:flex;
  align-items:center;justify-content:space-between;
  background:#111612;position:sticky;top:0;z-index:20;
  border-bottom:1px solid #ffffff12;
}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--mint)}
.header-right{display:flex;gap:10px;align-items:center}
.btn{
  background:var(--green);color:white;padding:12px 17px;
  border-radius:12px;font-weight:bold;
}
.btn:hover{background:var(--green2)}
.container{max-width:1150px;margin:auto;padding:22px 20px}
.page{display:none}
.page.active{display:block}
.hero{
  min-height:320px;border-radius:25px;padding:35px;
  display:flex;align-items:center;
  background:linear-gradient(90deg,#071c15ed,#071c1550),
  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1400') center/cover;
}
.hero-content{max-width:580px}
.hero h1{font-size:38px;line-height:1.2;margin-bottom:14px}
.hero p{color:#d4e7dc;line-height:1.6;margin-bottom:20px}
.search{
  display:flex;gap:8px;background:#ffffff18;
  padding:8px;border-radius:15px;max-width:500px;
}
.search input{
  flex:1;min-width:0;background:#fff;color:#222;
  border:0;border-radius:10px;padding:14px;
}
.section{margin-top:35px}
.section-head{
  display:flex;justify-content:space-between;
  align-items:end;gap:12px;margin-bottom:17px;
}
.section h2{font-size:25px}
.section-head p{color:var(--muted);margin-top:7px}
.tag{
  background:#17382c;color:var(--mint);
  padding:8px 12px;border-radius:30px;font-size:12px;
  font-weight:bold;white-space:nowrap;
}
.tabs{
  display:flex;gap:10px;overflow-x:auto;
  padding:8px 0 17px;scrollbar-width:none;
}
.tabs button{
  flex-shrink:0;background:#202420;color:#cbd5ce;
  padding:12px 18px;border-radius:30px;
}
.tabs button.active{background:var(--green);color:white}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
}
.card{
  background:var(--panel);border:1px solid #ffffff0d;
  border-radius:21px;overflow:hidden;
}
.card img{width:100%;height:190px;object-fit:cover;display:block}
.card-body{padding:16px}
.card h3{font-size:18px;margin:10px 0}
.card p{color:var(--muted);font-size:14px;line-height:1.5}
.price{font-size:21px;font-weight:800;margin:15px 0;color:var(--mint)}
.card .btn{width:100%;margin-top:7px}
.chip{
  display:inline-block;background:#20352a;color:var(--mint);
  padding:7px 12px;border-radius:20px;font-size:12px;
}
.feature-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-top:20px;
}
.feature{
  background:var(--panel);padding:18px;border-radius:16px;
  text-align:center;color:var(--mint);
